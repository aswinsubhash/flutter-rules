name: Bug report
description: Report an installation, packaging, validation, or documentation problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Flutter Rules.
  - type: dropdown
    id: host
    attributes:
      label: Host
      description: Where did the problem occur?
      options:
        - Codex
        - Claude Code
        - Cursor
        - Devin
        - Repository tooling
        - Not host-specific
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command or invocation and the smallest reproducible sequence.
      placeholder: |
        1. Install with ...
        2. Invoke with ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and relevant CLI or host versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Remove credentials, tokens, and other sensitive information before posting.
      render: shell
