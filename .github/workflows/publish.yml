name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Audit dependencies
        run: npm audit
      - name: Install Agent Skills validator
        run: pipx install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate repository
        run: ./scripts/validate.sh
      - name: Verify tagged skill source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          NO_COLOR: '1'
        run: |
          node node_modules/skills/bin/cli.mjs add "aswinsubhash/flutter-rules#$RELEASE_TAG" --list | tee /tmp/skills-list.txt
          grep -q 'Found 1 skill' /tmp/skills-list.txt
          grep -q 'flutter-rules' /tmp/skills-list.txt
      - name: Inspect npm package
        run: npm run pack:check
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
